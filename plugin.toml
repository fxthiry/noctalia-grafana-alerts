# Grafana Alerts — firing Grafana alerts in the Noctalia bar.
# Three entries: a headless fetch service (polls the Grafana Alertmanager API,
# publishes shared state, sends desktop notifications, creates silences), a bar
# widget (count + severity tint, click toggles the panel) and a panel (alert list
# with severity filter, folder, summary, labels, copy and silence actions).

id = "fxthiry/grafana-alerts"
name = "Grafana Alerts"
version = "0.2.0"
plugin_api = 19
author = "fxthiry"
license = "MIT"
tags = ["bar", "monitoring", "notifications", "panel", "service"]
icon = "alert-triangle"
description = "Firing Grafana alerts in your bar: count tinted by severity, click for the list with labels, desktop notifications, one-click silences."

[[setting]]
key = "grafana_url"
type = "string"
label_key = "settings.grafana_url.label"
description_key = "settings.grafana_url.description"
default = ""

[[setting]]
key = "api_token"
type = "string"
label_key = "settings.api_token.label"
description_key = "settings.api_token.description"
default = ""

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 60
min = 15
max = 3600

[[setting]]
key = "ignore_datasource_alerts"
type = "bool"
label_key = "settings.ignore_datasource_alerts.label"
description_key = "settings.ignore_datasource_alerts.description"
default = true

[[setting]]
key = "filters"
type = "string_list"
label_key = "settings.filters.label"
description_key = "settings.filters.description"
default = []

[[setting]]
key = "severity_label"
type = "string"
label_key = "settings.severity_label.label"
description_key = "settings.severity_label.description"
default = "severity"

[[setting]]
key = "hidden_labels"
type = "string_list"
label_key = "settings.hidden_labels.label"
description_key = "settings.hidden_labels.description"
default = ["alertname", "grafana_folder", "severity"]

[[setting]]
key = "notify_new_alerts"
type = "bool"
label_key = "settings.notify_new_alerts.label"
description_key = "settings.notify_new_alerts.description"
default = true

[[setting]]
key = "notify_min_severity"
type = "select"
label_key = "settings.notify_min_severity.label"
description_key = "settings.notify_min_severity.description"
default = "warning"

  [[setting.options]]
  value = "critical"
  label_key = "panel.severity.critical"

  [[setting.options]]
  value = "warning"
  label_key = "panel.severity.warning"

  [[setting.options]]
  value = "info"
  label_key = "panel.severity.info"

  [[setting.options]]
  value = "other"
  label_key = "settings.notify_min_severity.all"

[[setting]]
key = "show_silence_button"
type = "bool"
label_key = "settings.show_silence_button.label"
description_key = "settings.show_silence_button.description"
default = true

[[setting]]
key = "silence_duration"
type = "int"
label_key = "settings.silence_duration.label"
description_key = "settings.silence_duration.description"
default = 120
min = 5
max = 10080

[[setting]]
key = "critical_color"
type = "color"
label_key = "settings.critical_color.label"
description_key = "settings.critical_color.description"
default = "#ff5c5c"

[[setting]]
key = "warning_color"
type = "color"
label_key = "settings.warning_color.label"
description_key = "settings.warning_color.description"
default = "#f1c232"

[[setting]]
key = "allow_insecure_tls"
type = "bool"
label_key = "settings.allow_insecure_tls.label"
description_key = "settings.allow_insecure_tls.description"
default = false

# Headless service: owns all HTTP calls, publishes alerts/counts to shared state.
[[service]]
id = "fetch"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "alert-triangle"

  [[widget.setting]]
  key = "hide_when_zero"
  type = "bool"
  label_key = "settings.hide_when_zero.label"
  description_key = "settings.hide_when_zero.description"
  default = false

# Open with the bar widget click, or: noctalia msg panel-toggle fxthiry/grafana-alerts:panel
[[panel]]
id = "panel"
entry = "panel.luau"
width = 720
height = 640
placement = "attached"
position = "auto"
open_near_click = true
